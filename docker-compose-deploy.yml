services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PRELOAD_SCHEMAS=${PRELOAD_SCHEMAS:-DBLP}
    expose:
      - "8080"
    command: sh -c "uvicorn src.main:app --host 0.0.0.0 --port 8080"
    networks:
      - app_net

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    command: sh -c "npm run build && npm start"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_WS_URL=/api
      - NEXT_PROXY_TARGET=http://backend:8080
    ports:
      - 3000:3000
    depends_on:
      - backend
    networks:
      - app_net

networks:
  app_net:
